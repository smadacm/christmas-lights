{% extends "partials/_global.html" %}

{% block content %}
  <div class="active-status">Active: {active_program}</div>

  <div class="blocks">
    <div class="block">
      <div class="block-title">Mods</div>
      <div class="btn-row">
        {mod_toggles}
      </div>
    </div>

    {mod_blocks}

    <div class="block">
      <div class="block-title">Timing: {sleep_modifier}x</div>
      <div class="bright-display">Base: {base_sleep_ms}ms / Actual: {effective_sleep_ms}ms</div>
      <form class="form-row" action="/timing" method="get">
        <label for="modifier">Speed:</label>
        <input id="modifier" type="number" name="modifier" value="{sleep_modifier}" min="0.001" max="10" step="0.001">
        <button type="submit">Set</button>
      </form>
      <div class="btn-row">
        <a href="/timing/set/0.5">0.5x</a>
        <a href="/timing/set/1">1x</a>
        <a href="/timing/set/2">2x</a>
      </div>
    </div>

    <div class="block">
      <div class="block-title">String Length</div>
      <form class="form-row" action="/string_length" method="get">
        <label for="length">LEDs:</label>
        <input id="length" type="number" name="length" value="{string_length}" min="1" max="1000">
        <button type="submit">Set</button>
      </form>
    </div>

    <div class="block">
      <div class="block-title">Patterns</div>
      <ul class="buttons">
        {pattern_buttons}
      </ul>
    </div>
  </div>
{% endblock %}
