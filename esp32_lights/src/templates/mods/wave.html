<div class="block">
  <div class="block-title">Wave Mod: {wave_status}</div>
  <div class="btn-row">
    <a href="/mod/wave/off">Off</a>
    <a href="/mod/wave/forward">Wave</a>
    <a href="/mod/wave/reverse">Reverse Wave</a>
  </div>
  <form class="form-row" action="/mod/wave" method="get">
    <label for="wave_min">Min%</label>
    <input id="wave_min" type="number" name="min" value="{wave_min}" min="0" max="100">
    <label for="wave_max">Max%</label>
    <input id="wave_max" type="number" name="max" value="{wave_max}" min="0" max="100">
    <label for="wave_width">Width</label>
    <input id="wave_width" type="number" name="width" value="{wave_width}" min="2" max="1000">
    <button type="submit">Set</button>
  </form>
</div>
