<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* {
    box-sizing: border-box;
}
body {
    background-color: #eee;
    font-family: Tahoma,Arial,Sans-serif;
    margin: 0;
    padding: 0.75em;
}
.active-status {
    margin: 0 0 1.25em;
    padding: 0.75em 1em;
    background-color: #333;
    color: #fff;
    font-size: 1.3em;
    font-weight: bold;
    text-align: center;
    border-radius: 6px;
}
.blocks {
    display: flex;
    flex-wrap: wrap;
    gap: 1em;
    align-items: flex-start;
}
.block {
    flex: 1 1 320px;
    border: 2px solid #bbb;
    border-radius: 6px;
    padding: 0.9em;
    background-color: #f8f8f8;
}
.block-title {
    margin: 0 0 0.75em;
    padding-bottom: 0.4em;
    border-bottom: 1px solid #ddd;
    font-size: 1.1em;
    font-weight: bold;
    color: #333;
    text-align: center;
}
ul.buttons {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 0.5em;
}
ul.buttons li {
    flex: 1 1 140px;
    display: block;
    margin: 0;
}
ul.buttons li a {
    padding: 0.65em 0.5em;
    display: block;
    text-decoration: none;
    text-align: center;
    background-color: #aaa;
    font-weight: bold;
    border-radius: 4px;
}
ul.buttons li a,
ul.buttons li a:active,
ul.buttons li a:visited {
    color: #fff;
}
.btn-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5em;
    margin: 0.6em 0;
}
.btn-row a {
    flex: 1 1 60px;
    padding: 0.75em 0.5em;
    display: block;
    text-decoration: none;
    text-align: center;
    background-color: #aaa;
    font-weight: bold;
    font-size: 1.05em;
    border-radius: 4px;
}
.btn-row a,
.btn-row a:active,
.btn-row a:visited {
    color: #fff;
}
.bright-display {
    flex: 1 1 100%;
    padding: 0.4em 0.5em;
    text-align: center;
    font-weight: bold;
    font-size: 1.05em;
    color: #333;
}
.form-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5em;
    margin: 0.6em 0;
    align-items: center;
    font-weight: bold;
    font-size: 1em;
}
.form-row label {
    color: #333;
}
.form-row input {
    flex: 1 1 70px;
    min-width: 60px;
    padding: 0.6em 0.4em;
    font-size: 1em;
    text-align: center;
    border: 1px solid #aaa;
    border-radius: 4px;
}
.form-row button {
    flex: 0 0 auto;
    padding: 0.65em 1.25em;
    background-color: #aaa;
    color: #fff;
    border: none;
    border-radius: 4px;
    font-weight: bold;
    font-size: 1em;
    cursor: pointer;
}
</style>
</head>
<body>
  {% block content %}{% endblock%}
</body>
</html>
