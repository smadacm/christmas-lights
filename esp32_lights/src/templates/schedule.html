{% extends "partials/_global.html" %}

{% block content %}
  <div class="active-status">Schedule Builder (Eastern: {eastern_time})</div>

  <div class="btn-row">
    <a href="/">&larr; Back to Controls</a>
    <a href="#" id="add-job-btn">+ Add Job</a>
    <a href="#" id="save-btn">Save Schedule</a>
  </div>

  <div id="save-status" class="bright-display"></div>

  <div id="jobs-container" class="blocks"></div>

  <script>
    const PROGRAMS = {programs_json};
    const MODS = {mods_json};
    let jobs = {schedule_json};

    const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

    function parseCron(cron) {
      const parts = (cron || '0 17 * * *').trim().split(/\s+/);
      const min = parseInt(parts[0], 10);
      const hr = parseInt(parts[1], 10);
      const wday = parts[4] || '*';
      const timeValid = !isNaN(min) && !isNaN(hr) && parts[0] !== '*' && parts[1] !== '*';
      const hh = timeValid ? String(hr).padStart(2, '0') : '17';
      const mm = timeValid ? String(min).padStart(2, '0') : '00';

      let days = [];
      if (wday === '*') {
        days = [0, 1, 2, 3, 4, 5, 6];
      } else {
        wday.split(',').forEach(p => {
          if (p.includes('-')) {
            const [a, b] = p.split('-').map(n => parseInt(n, 10));
            for (let d = a; d <= b; d++) days.push(d === 7 ? 0 : d);
          } else {
            const d = parseInt(p, 10);
            if (!isNaN(d)) days.push(d === 7 ? 0 : d);
          }
        });
      }
      return { time: hh + ':' + mm, days };
    }

    function buildCron(timeStr, days) {
      const [hh, mm] = (timeStr || '17:00').split(':').map(n => parseInt(n, 10) || 0);
      const uniqueDays = [...new Set(days)].sort((a, b) => a - b);
      const wday = (uniqueDays.length === 0 || uniqueDays.length === 7) ? '*' : uniqueDays.join(',');
      return `${mm} ${hh} * * ${wday}`;
    }

    function defaultParamsForMod(modName) {
      if (modName === 'brightness') return { enabled: true, level: 50 };
      if (modName === 'twinkle') return { enabled: true, count: 5, speed: 1 };
      if (modName === 'wave') return { enabled: true, direction: 1, min_brightness: 20, max_brightness: 100, width: 20 };
      return { enabled: true };
    }

    function renderModParams(action, jobIdx, actIdx) {
      const p = action.params || {};
      if (action.name === 'brightness') {
        return `
          <label><input type="checkbox" ${p.enabled !== false ? 'checked' : ''} onchange="updateParam(${jobIdx},${actIdx},'enabled',this.checked)"> On</label>
          <label>Level%</label>
          <input type="number" min="0" max="100" value="${p.level ?? 50}" onchange="updateParam(${jobIdx},${actIdx},'level',Number(this.value))">
        `;
      }
      if (action.name === 'twinkle') {
        return `
          <label><input type="checkbox" ${p.enabled !== false ? 'checked' : ''} onchange="updateParam(${jobIdx},${actIdx},'enabled',this.checked)"> On</label>
          <label>LEDs</label>
          <input type="number" min="1" max="1000" value="${p.count ?? 5}" onchange="updateParam(${jobIdx},${actIdx},'count',Number(this.value))">
          <label>Frames</label>
          <input type="number" min="1" max="1000" value="${p.speed ?? 1}" onchange="updateParam(${jobIdx},${actIdx},'speed',Number(this.value))">
        `;
      }
      if (action.name === 'wave') {
        return `
          <label><input type="checkbox" ${p.enabled !== false ? 'checked' : ''} onchange="updateParam(${jobIdx},${actIdx},'enabled',this.checked)"> On</label>
          <select onchange="updateParam(${jobIdx},${actIdx},'direction',Number(this.value))">
            <option value="1" ${p.direction === 1 ? 'selected' : ''}>Wave</option>
            <option value="-1" ${p.direction === -1 ? 'selected' : ''}>Reverse Wave</option>
            <option value="0" ${p.direction === 0 ? 'selected' : ''}>Off</option>
          </select>
          <label>Min%</label>
          <input type="number" min="0" max="100" value="${p.min_brightness ?? 20}" onchange="updateParam(${jobIdx},${actIdx},'min_brightness',Number(this.value))">
          <label>Max%</label>
          <input type="number" min="0" max="100" value="${p.max_brightness ?? 100}" onchange="updateParam(${jobIdx},${actIdx},'max_brightness',Number(this.value))">
          <label>Width</label>
          <input type="number" min="2" max="1000" value="${p.width ?? 20}" onchange="updateParam(${jobIdx},${actIdx},'width',Number(this.value))">
        `;
      }
      return '';
    }

    function render() {
      const container = document.getElementById('jobs-container');
      container.innerHTML = '';

      jobs.forEach((job, jobIdx) => {
        const parsed = parseCron(job.cron);
        const card = document.createElement('div');
        card.className = 'block';

        const dayCheckboxes = DAYS.map((label, dIdx) => `
          <label style="margin-right:0.4em;font-weight:normal;">
            <input type="checkbox" ${parsed.days.includes(dIdx) ? 'checked' : ''} onchange="toggleDay(${jobIdx}, ${dIdx}, this.checked)"> ${label}
          </label>
        `).join('');

        const actionsHtml = (job.actions || []).map((act, actIdx) => {
          if (act.type === 'program') {
            const opts = PROGRAMS.map(p => `<option value="${p.name}" ${act.name === p.name ? 'selected' : ''}>${p.label}</option>`).join('');
            return `
              <div class="form-row">
                <span>Program:</span>
                <select onchange="updateActionName(${jobIdx},${actIdx},this.value)">${opts}</select>
                <button type="button" onclick="removeAction(${jobIdx},${actIdx})">X</button>
              </div>
            `;
          }
          const modOpts = MODS.map(m => `<option value="${m}" ${act.name === m ? 'selected' : ''}>${m}</option>`).join('');
          return `
            <div class="form-row">
              <span>Mod:</span>
              <select onchange="changeModType(${jobIdx},${actIdx},this.value)">${modOpts}</select>
              ${renderModParams(act, jobIdx, actIdx)}
              <button type="button" onclick="removeAction(${jobIdx},${actIdx})">X</button>
            </div>
          `;
        }).join('');

        card.innerHTML = `
          <div class="block-title">${job.name || 'Scheduled Job'}</div>
          <div class="form-row">
            <label>Name:</label>
            <input type="text" value="${(job.name || '').replace(/"/g, '&quot;')}" onchange="jobs[${jobIdx}].name=this.value;render()">
            <label><input type="checkbox" ${job.enabled !== false ? 'checked' : ''} onchange="jobs[${jobIdx}].enabled=this.checked"> Enabled</label>
          </div>
          <div class="form-row">
            <label>Time:</label>
            <input type="time" value="${parsed.time}" onchange="updateTime(${jobIdx}, this.value)">
            <label>Cron:</label>
            <input type="text" value="${job.cron || '0 17 * * *'}" onchange="jobs[${jobIdx}].cron=this.value;render()">
          </div>
          <div class="form-row">${dayCheckboxes}</div>
          <div>${actionsHtml}</div>
          <div class="btn-row">
            <a href="#" onclick="addProgramAction(${jobIdx});return false;">+ Program</a>
            <a href="#" onclick="addModAction(${jobIdx});return false;">+ Mod</a>
            <a href="#" onclick="removeJob(${jobIdx});return false;">Delete Job</a>
          </div>
        `;
        container.appendChild(card);
      });
    }

    window.toggleDay = function(jobIdx, dayIdx, checked) {
      const parsed = parseCron(jobs[jobIdx].cron);
      const set = new Set(parsed.days);
      if (checked) set.add(dayIdx); else set.delete(dayIdx);
      jobs[jobIdx].cron = buildCron(parsed.time, Array.from(set));
      render();
    };

    window.updateTime = function(jobIdx, timeVal) {
      const parsed = parseCron(jobs[jobIdx].cron);
      jobs[jobIdx].cron = buildCron(timeVal, parsed.days);
      render();
    };

    window.updateActionName = function(jobIdx, actIdx, name) {
      jobs[jobIdx].actions[actIdx].name = name;
    };

    window.changeModType = function(jobIdx, actIdx, modName) {
      jobs[jobIdx].actions[actIdx].name = modName;
      jobs[jobIdx].actions[actIdx].params = defaultParamsForMod(modName);
      render();
    };

    window.updateParam = function(jobIdx, actIdx, key, val) {
      if (!jobs[jobIdx].actions[actIdx].params) jobs[jobIdx].actions[actIdx].params = {};
      jobs[jobIdx].actions[actIdx].params[key] = val;
    };

    window.addProgramAction = function(jobIdx) {
      jobs[jobIdx].actions.push({ type: 'program', name: PROGRAMS[0] ? PROGRAMS[0].name : 'off' });
      render();
    };

    window.addModAction = function(jobIdx) {
      const modName = MODS[0] || 'brightness';
      jobs[jobIdx].actions.push({ type: 'mod', name: modName, params: defaultParamsForMod(modName) });
      render();
    };

    window.removeAction = function(jobIdx, actIdx) {
      jobs[jobIdx].actions.splice(actIdx, 1);
      render();
    };

    window.removeJob = function(jobIdx) {
      jobs.splice(jobIdx, 1);
      render();
    };

    document.getElementById('add-job-btn').addEventListener('click', function(e) {
      e.preventDefault();
      jobs.push({
        name: 'New Job',
        cron: '0 17 * * *',
        enabled: true,
        actions: [{ type: 'program', name: PROGRAMS[0] ? PROGRAMS[0].name : 'off' }],
      });
      render();
    });

    document.getElementById('save-btn').addEventListener('click', async function(e) {
      e.preventDefault();
      const status = document.getElementById('save-status');
      status.textContent = 'Saving...';
      try {
        const res = await fetch('/api/schedule', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ jobs }),
        });
        const data = await res.json();
        status.textContent = data.ok ? `Saved ${data.count} job(s)!` : `Error: ${data.error}`;
      } catch (err) {
        status.textContent = 'Save failed: ' + err.message;
      }
    });

    render();
  </script>
{% endblock %}
